backend:
  name: github
  # GANTI dengan username dan nama repositori Anda (contoh: sekolahnama/materi-web)
  repo: username-anda/nama-repo-anda 
  branch: main

# Pengaturan lokasi penyimpanan gambar atau file yang diunggah guru
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ==========================================
  # MATERI KELAS 7
  # ==========================================
  - name: "k7_agama"
    label: "Kelas 7 - Pendidikan Agama Islam"
    folder: "materi/kelas7/agama"
    create: true
    # Blok 'fields' ini sekaligus dijadikan template dasar (anchor) 
    # untuk dipakai di semua mata pelajaran di bawahnya
    fields: &fields_template
      - {label: "Judul Materi", name: "title", widget: "string"}
      - {label: "Nama Guru", name: "author", widget: "string"}
      - {label: "Upload File Materi (Bisa PDF atau HTML)", name: "file_materi", widget: "file", required: false, hint: "Gunakan ini jika guru ingin mengunggah file langsung."}
      - {label: "Isi Materi (Ketik/Paste dari Word)", name: "body", widget: "markdown", required: false, hint: "Gunakan ini jika guru ingin mengetik atau copy-paste materi."}

  - name: "k7_pancasila"
    label: "Kelas 7 - Pendidikan Pancasila"
    folder: "materi/kelas7/pancasila"
    create: true
    fields: *fields_template

