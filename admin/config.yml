    create: true
    fields: *fields_template

  - name: "k7_binggris"
    label: "Kelas 7 - Bahasa Inggris"
    folder: "materi/kelas7/binggris"
    create: true
    fields: *fields_template

  - name: "k7_pjok"
    label: "Kelas 7 - PJOK"
    folder: "materi/kelas7/pjok"
    create: true
    fields: *fields_template

  - name: "k7_informatika"
